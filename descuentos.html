<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Porcentajes y Descuentos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>

    <header>
      <h1>
        Porcentajes y Descuentos
      </h1>
      <p>Este es el segundo taller del Curso Prático de JavaScript.</p>
    </header>

    <section>
      <h2>Calcula el precio a pagar de tus productos con descuentos</h2>
      <form>

        <label for="InputPrice">Escribir el precio de tu producto: </label>
        <input id="InputPrice" type="number" />

        <label for="InputCoupon">Escribir el cupón de descuento para tu producto: </label>
        <input id="InputCoupon" type="text"/>

        <button type="button" onclick="onClickButtonPriceDiscount()">Calcular el precio con descuento</button>
        <p id="ResultP"></p>
    </section>
    <script src="./clase-10-descuentos.js">  </script>
  </body>
</html>
